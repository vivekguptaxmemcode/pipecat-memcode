[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipecat-memcode"
version = "0.1.0"
description = "Memcode long-term memory processors for Pipecat"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
authors = [{ name = "Memcode" }]
keywords = ["pipecat", "memcode", "memory", "voice-ai", "oauth"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "memcode-sdk>=2.4.0,<3",
  "pipecat-ai>=1.10,<1.11",
]

[project.urls]
Homepage = "https://memcode.in"
Documentation = "https://github.com/vivekguptaxmemcode/pipecat-memcode#readme"
Repository = "https://github.com/vivekguptaxmemcode/pipecat-memcode"
Issues = "https://github.com/vivekguptaxmemcode/pipecat-memcode/issues"

[project.optional-dependencies]
example = [
  "cryptography>=45,<47",
  "pipecat-ai[deepgram,runner,webrtc]>=1.10,<1.11",
]

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipecat_memcode = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
